# For `alembic ...` commands run from this folder, with DATABASE_URL set, e.g.
#   uv run alembic revision --autogenerate -m "add a column"
# The service runs `upgrade head` by itself, at startup or on its first
# database call (store.py). The database URL comes from DATABASE_URL, not here.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
